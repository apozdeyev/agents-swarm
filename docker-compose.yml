services:
  cao:
    build:
      context: .
      args:
        CAO_VERSION: "2.5.0"
        CLAUDE_VERSION: "2.1.260"
        CODEX_VERSION: "0.153.2"
        OPENCODE_VERSION: "1.18.29"
    image: cao:dev
    container_name: cao
    init: true                          # reap orphaned tmux/node children
    ports:
      - "127.0.0.1:9889:9889"           # loopback only: cao-server has no request auth
    environment:
      CAO_HOME_DIR: /home/cao/.cao
      # Bind address for cao-server only. Must NOT be CAO_API_HOST: the CLI reuses
      # that var as its client URL and would then be rejected by TrustedHostMiddleware.
      CAO_BIND_HOST: "0.0.0.0"
      CAO_API_PORT: "9889"
      # TrustedHostMiddleware rejects non-loopback Host headers even when bound to 0.0.0.0.
      CAO_ALLOWED_HOSTS: "localhost,127.0.0.1"
      # The websocket peer is the docker bridge gateway, never loopback.
      # Safe to leave open because the port is published to 127.0.0.1 only.
      CAO_WS_ALLOWED_CLIENTS: "*"
      # Agents clone and edit inside the container; git refuses to commit without an identity.
      GIT_USER_NAME: "apozdeyev"
      GIT_USER_EMAIL: "anatoliy.pozdeyev@gmail.com"
    # OpenCode has no interactive login: it enables the deepseek provider from
    # DEEPSEEK_API_KEY in the environment. Kept in .env (gitignored), not here.
    # The mapping form because a plain-string entry is mandatory: .env is gitignored and
    # the Quick start opens with `./cao up`, so on a fresh clone compose aborted before
    # creating anything, and the stack could not be started at all. Note what a missing
    # key does NOT do: `HARNESSES` in the workflow is a constant, so the opencode steps
    # still run and fail, and the review comes back with them in `failures`. `./cao
    # status` says whether the key reached the container.
    env_file:
      - path: .env
        required: false
    volumes:
      - cao-state:/home/cao/.cao        # sqlite, logs, agent-store, skills
      - claude-auth:/home/cao/.claude   # .credentials.json
      - codex-auth:/home/cao/.codex     # auth.json, config.toml
      - gh-auth:/home/cao/.config/gh    # hosts.yml
      # CAO puts OpenCode's agents + opencode.json under ~/.aws/opencode (AWS-heritage
      # path, nothing to do with AWS credentials). Needs a volume: a container recreate
      # would otherwise wipe it while the bootstrap sentinel on cao-state survives, so
      # bootstrap never re-runs and reviewer_opencode goes silently missing.
      - opencode-config:/home/cao/.aws
      - workspace:/home/cao/workspace   # cloned repos
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:9889/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    restart: unless-stopped

volumes:
  cao-state:
  claude-auth:
  codex-auth:
  gh-auth:
  opencode-config:
  workspace:
